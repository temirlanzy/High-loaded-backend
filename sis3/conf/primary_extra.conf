listen_addresses = '127.0.0.1'
port = 5432
max_connections = 300
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 256MB
wal_level = replica
max_wal_senders = 5
hot_standby = on
synchronous_commit = off
checkpoint_timeout = 15min
max_wal_size = 4GB
track_io_timing = on
logging_collector = off
unix_socket_directories = '/tmp'
