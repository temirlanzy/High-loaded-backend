[databases]
; read/write -> primary
todo    = host=127.0.0.1 port=5432 dbname=todo
; read-only -> replica
todo_ro = host=127.0.0.1 port=5433 dbname=todo

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir = /tmp
auth_type = trust
auth_file = /var/lib/sis3/userlist.txt
admin_users = postgres
pool_mode = transaction
default_pool_size = 16
min_pool_size = 4
reserve_pool_size = 4
max_client_conn = 1000
max_db_connections = 40
server_idle_timeout = 600
ignore_startup_parameters = extra_float_digits
logfile = /var/lib/sis3/pgbouncer.log
pidfile = /var/lib/sis3/pgbouncer.pid
